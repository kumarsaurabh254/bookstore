<!doctype html>
<!-- Experiment 1: Homepage with three frames (top, left, main) -->
<html lang="en" class="frames-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GL Bajaj Book Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Frame 1: top (logo, college name, links) -->
    <iframe class="frame-top" name="topFrame" src="top.html" title="Top frame"></iframe>
    <div class="frame-row">
      <!-- Frame 2: left (quick links) -->
      <iframe class="frame-left" name="leftFrame" src="left.html" title="Left frame"></iframe>
      <!-- Frame 3: main content, all links open here -->
      <iframe class="frame-main" name="main" src="welcome.html" title="Main frame"></iframe>
    </div>
  </body>
</html>
